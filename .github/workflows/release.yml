name: Build & Release WordLoop (PC, Android APK, iOS, Web)

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ============================================================
  # 1. BUILD WEB APP
  # ============================================================
  build-web:
    name: 🌐 Build Web Distribution
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm install

      - name: Build Web Application
        run: npm run build:web

      - name: Zip Web Artifact
        run: |
          mkdir -p release_artifacts
          TAG="${{ github.ref_name || 'latest' }}"
          cd dist && zip -r ../release_artifacts/WordLoop-Web-${TAG}.zip .

      - name: Upload Web Artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: release_artifacts/*

  # ============================================================
  # 2. BUILD PC DESKTOP (WINDOWS .EXE)
  # ============================================================
  build-windows:
    name: 💻 Build Windows PC Desktop (.exe)
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm install

      - name: Build Web App
        run: node scripts/build-web.js

      - name: Install Electron & Electron-Builder
        run: npm install --save-dev electron electron-builder

      - name: Package Windows Executable
        env:
          ELECTRON_BUILDER_ALLOW_UNRESOLVED_DEPENDENCIES: 'true'
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/build-electron.js --publish never

      - name: Collect Windows Executables
        shell: bash
        run: |
          mkdir -p release_artifacts
          find dist_electron -maxdepth 1 -type f -name "*.exe" -exec cp {} release_artifacts/ \;
          ls -la release_artifacts/

      - name: Upload Windows PC Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-pc
          path: release_artifacts/*

  # ============================================================
  # 3. BUILD ANDROID APP (.APK)
  # ============================================================
  build-android:
    name: 📱 Build Android App (.apk)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Node.js (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm install

      - name: Build Web Assets
        run: node scripts/build-web.js

      - name: 🔨 Package Standalone Android APK (Binary AXML 0x00080003)
        run: |
          mkdir -p release_artifacts
          python3 scripts/package-apk.py release_artifacts
          VER=$(node -p "try { require('./package.json').version } catch(e) { '3.72.0' }")
          TAG="${{ github.ref_name || 'latest' }}"
          if [ -f "public/downloads/WordLoop-v${VER}.apk" ]; then
            cp "public/downloads/WordLoop-v${VER}.apk" "release_artifacts/WordLoop-${TAG}.apk" || true
          fi
          if [ -f "public/downloads/WordLoop.apk" ]; then
            cp "public/downloads/WordLoop.apk" "release_artifacts/WordLoop.apk" || true
          fi
          echo "========================================="
          echo "📦 Android APK release artifacts:"
          ls -lh release_artifacts/
          echo "========================================="

      - name: Try Optional Capacitor Android Gradle Build
        continue-on-error: true
        run: |
          npm install --save-dev @capacitor/core @capacitor/cli @capacitor/android --legacy-peer-deps || true
          node scripts/sync-android.js auto || true
          if [ -d "android" ] && [ -f "android/gradlew" ]; then
            cd android
            chmod +x ./gradlew
            ./gradlew assembleDebug --no-daemon || true
            cd ..
            if [ -f "android/app/build/outputs/apk/debug/app-debug.apk" ]; then
              TAG="${{ github.ref_name || 'latest' }}"
              cp android/app/build/outputs/apk/debug/app-debug.apk "release_artifacts/WordLoop-Capacitor-${TAG}.apk" || true
            fi
          fi

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: release_artifacts/*.apk
          if-no-files-found: error

  # ============================================================
  # 4. BUILD IOS PACKAGE (PWA / XCODE ARCHIVE)
  # ============================================================
  build-ios:
    name: 🍎 Build iOS (iPhone / iPad Package)
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm install

      - name: Build Web Application
        run: npm run build:web

      - name: Install Capacitor iOS
        run: npm install @capacitor/core --save && npm install @capacitor/cli @capacitor/ios --save-dev

      - name: Add & Sync iOS Platform
        run: |
          npx cap add ios || true
          npx cap sync ios || true

      - name: Package iOS Project Bundle
        run: |
          mkdir -p release_artifacts
          TAG="${{ github.ref_name || 'latest' }}"
          if [ -d "ios" ]; then
            zip -r release_artifacts/WordLoop-iOS-Project-${TAG}.zip ios dist
          else
            zip -r release_artifacts/WordLoop-iOS-WebBundle-${TAG}.zip dist
          fi
          ls -la release_artifacts/

      - name: Upload iOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-package
          path: release_artifacts/*

  # ============================================================
  # 5. CREATE GITHUB RELEASE WITH ALL ASSETS
  # ============================================================
  publish-release:
    name: 🚀 Publish GitHub Release with Installers
    needs: [build-web, build-windows, build-android, build-ios]
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Create Assets Directory
        run: mkdir -p all_release_assets

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          path: all_release_assets
          merge-multiple: true

      - name: Generate Release Notes and Dynamic Tag
        id: release_meta
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
          else
            VER=$(node -p "try { require('./package.json').version } catch(e) { '3.72.0' }")
            TAG="v${VER}"
          fi
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "Processing notes for ${TAG}..."
          if [ -f "docs/PATCH_NOTES.md" ]; then
            head -n 45 docs/PATCH_NOTES.md > current_notes.txt
          else
            echo "WordLoop Release ${TAG}" > current_notes.txt
          fi

      - name: 🛡️ Verify and Guarantee Android APK is Present
        run: |
          echo "========================================="
          echo "🔍 Checking for Android APK in all_release_assets..."
          if ! ls all_release_assets/*.apk 1> /dev/null 2>&1; then
            echo "⚠️ [Warning] APK artifact was missing from build-android! Generating directly via package-apk.py..."
            node scripts/build-web.js
            python3 scripts/package-apk.py all_release_assets
            VER=$(node -p "try { require('./package.json').version } catch(e) { '3.72.0' }")
            TAG="${{ steps.release_meta.outputs.tag }}"
            if [ -f "public/downloads/WordLoop-v${VER}.apk" ]; then
              cp "public/downloads/WordLoop-v${VER}.apk" "all_release_assets/WordLoop-${TAG}.apk" || true
            elif [ -f "public/downloads/WordLoop.apk" ]; then
              cp "public/downloads/WordLoop.apk" "all_release_assets/WordLoop-${TAG}.apk" || true
            fi
          else
            echo "✅ Android APK successfully verified in release assets!"
          fi
          echo "========================================="
          echo "📦 Final verified assets to be published on GitHub Release:"
          ls -lh all_release_assets/
          echo "========================================="

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_meta.outputs.tag }}
          name: WordLoop ${{ steps.release_meta.outputs.tag }}
          body_path: current_notes.txt
          draft: false
          prerelease: false
          files: all_release_assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

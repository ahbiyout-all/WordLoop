    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />

    <style>
      body {
        margin: 0;
        padding: 0;
        background-color: #0f172a;
        color: #f8fafc;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      }
      #root:empty + #app-preloader,
      #root:has(#app-preloader) {
        display: flex;
      }
      .preloader-spinner {
        width: 24px;
        height: 24px;
        border: 3px solid rgba(99, 102, 241, 0.2);
        border-top-color: #6366f1;
        border-radius: 50%;
        animation: preloader-spin 0.8s linear infinite;
      }
      @keyframes preloader-spin {
        to { transform: rotate(360deg); }
      }
    </style>
    <script type="module" src="./assets/index-CqnThXBO.js"></script>
    <link rel="stylesheet" href="./assets/index-C0f8jOdV.css">
  </head>
  <body>
    <div id="root">
      <div id="app-preloader" style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background-color: #0f172a; color: #f8fafc;">
        <div style="font-size: 32px; font-weight: 900; letter-spacing: -0.05em; margin-bottom: 16px; background: linear-gradient(135deg, #818cf8, #c084fc, #f472b6); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">WordLoop</div>
        <div style="display: flex; align-items: center; gap: 10px; font-size: 14px; color: #94a3b8;">
          <div class="preloader-spinner"></div>
          <span>앱을 시작하는 중입니다...</span>
        </div>
      </div>
    </div>
